# Rate-limit zones for hub.vertexmedia.pro, installed as /etc/nginx/conf.d/vertexhub-limits.conf.
# Defence in depth under Better Auth's own sign-in limits. Hits are logged to the site's error
# log, which the nginx-limit-req fail2ban jail watches.
# 30 a minute: an office shares one public IP, and the API limits failures per account too.
limit_req_zone $binary_remote_addr zone=vhsignin:10m rate=30r/m;

# Notification streams (F14) hold their connection for 15 minutes; they get their own per-IP cap
# so open tabs never use up the site-wide connection limit (an office shares one public IP).
limit_conn_zone $binary_remote_addr zone=vhstream:10m;

# Approval links (F09, ADR 0020): anonymous routes behind a random token. 60 a minute per address
# is far above a client reading a page and its files, and far below guessing tokens.
limit_req_zone $binary_remote_addr zone=vhapproval:10m rate=60r/m;

# The access log of the approval link routes: the token in the path is the link's only
# credential, so it is masked, and the referrer (the client page, whose address is the token) is
# left out.
map $request_uri $vh_public_uri {
    ~^/api/public/approvals/[^/?]+(?<vh_public_rest>.*)$ /api/public/approvals/-$vh_public_rest;
    default $request_uri;
}
log_format vhpublic '$remote_addr - - [$time_local] "$request_method $vh_public_uri" '
                    '$status $body_bytes_sent "$http_user_agent"';
