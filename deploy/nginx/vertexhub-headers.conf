# Response headers for hub.vertexmedia.pro, installed as /etc/nginx/snippets/vertexhub-headers.conf.
# Included in the server block and again in every location that sets its own add_header, because
# add_header in a location drops everything inherited from the server block (SERVER.md rule 12).

# The server's standard set: HSTS, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy.
include snippets/security-headers.conf;

# Content Security Policy. The only inline script is the theme bootstrap in apps/web/index.html;
# its hash is checked against that file by apps/web/src/csp.test.ts. Inline style attributes are
# allowed because Base UI positions popups with them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-hA1eLIXR4j0c584VsMURWrzStB2HIJiv2unYaq1RNU8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# An internal system: keep it out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
