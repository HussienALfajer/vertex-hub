# Response headers for hub.vertexmedia.pro, installed as /etc/nginx/snippets/vertexhub-headers.conf.
# Included in the server block and again in every location that sets its own add_header, because
# add_header in a location drops everything inherited from the server block (SERVER.md rule 12).

# The server's standard set (snippets/security-headers.conf; HSTS as the site's other locations
# send it), copied rather than included: the hub needs the camera (the entrance code scanner) and
# the location (every attendance punch, F17 rule C6a), which the standard Permissions-Policy turns
# off. Microphone and payment stay off.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;

# Content Security Policy: its own snippet, shared with the client page of approval links.
include snippets/vertexhub-csp.conf;

# An internal system: keep it out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
