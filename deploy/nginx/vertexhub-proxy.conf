# Proxy settings for the Vertex Hub API, installed as /etc/nginx/snippets/vertexhub-proxy.conf.
# X-Forwarded-For is overwritten, not appended: the API trusts it for rate limiting and audit,
# and only nginx can reach the API (it listens on loopback).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
proxy_read_timeout 60s;
proxy_hide_header X-Powered-By;
