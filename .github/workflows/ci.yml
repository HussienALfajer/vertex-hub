name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (the tag in the comment); Dependabot
# proposes updates (.github/dependabot.yml).
jobs:
  # Pull requests that change only Markdown no check reads (everything outside brand/) skip the
  # checks; the gate jobs below still report, so the ruleset and auto-merge work.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '\.md$' && ! echo "$changed" | grep -q '^brand/'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Checks needed: $code"

  static:
    name: Lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vertex_hub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vertex_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertex_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vertex_hub:ci-only-password@localhost:5432/vertex_hub_test
      TEST_DATABASE_URL: postgres://vertex_hub:ci-only-password@localhost:5432/vertex_hub_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache across runs: tasks whose inputs did not change are replayed, not rerun
      # (a merge to main replays its pull request's tasks).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - name: No known high-severity advisory in production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      - name: The web app's OpenAPI document and client types match the API
        run: |
          pnpm --filter @vertex-hub/api openapi:export
          pnpm --filter @vertex-hub/web api:generate
          git diff --exit-code -- apps/web/src/lib/api
      # What deploy.sh runs, on the built files: the migrate CLI, then the API and the worker
      # as PM2 starts them. The API must answer its health check; the worker must schedule its
      # jobs and stay up.
      - name: The built API and worker start
        env:
          WORKER_NAME: ci
        run: |
          node packages/db/dist/cli/migrate.js
          node apps/api/dist/main.js > api.log 2>&1 &
          node apps/worker/dist/main.js > worker.log 2>&1 &
          worker=$!
          curl --retry 30 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:3000/api/health
          for _ in $(seq 1 30); do
            if grep -q 'Scheduled system.heartbeat' worker.log; then
              sleep 5
              kill -0 "$worker" && exit 0
              break
            fi
            sleep 2
          done
          echo "The worker did not start"; cat api.log worker.log; exit 1
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vertex_hub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vertex_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertex_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vertex_hub:ci-only-password@localhost:5432/vertex_hub_test
      TEST_DATABASE_URL: postgres://vertex_hub:ci-only-password@localhost:5432/vertex_hub_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache across runs: tasks whose inputs did not change are replayed, not rerun
      # (a merge to main replays its pull request's tasks).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      # One test database per parallel worker of the api suite (TEST_WORKERS, packages/db testing.ts).
      - name: The api suite's worker databases
        run: for n in 1 2 3 4; do psql "$DATABASE_URL" -c "create database vertex_hub_test_api_$n"; done
      # The worker's quote PDF test renders with Chromium (F04).
      - run: pnpm --filter @vertex-hub/worker exec playwright install --with-deps chromium
      - run: pnpm test
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  e2e:
    name: Playwright shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The tests split over four runners (Playwright --shard).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache across runs: tasks whose inputs did not change are replayed, not rerun
      # (a merge to main replays its pull request's tasks).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-${{ matrix.shard }}-
      - run: pnpm --filter @vertex-hub/web exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e -- --shard=${{ matrix.shard }}/4
      # The report and the RTL screenshots (light and dark) are the review evidence of each run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  # The checks the main ruleset requires: they pass when every job behind them passed or was
  # skipped (documentation only), and fail otherwise.
  checks:
    name: Typecheck, lint, test, build
    needs: [changes, static, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          ! echo "$NEEDS" | grep -qE '"result": "(failure|cancelled)"'

  e2e-gate:
    name: Playwright smoke
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          ! echo "$NEEDS" | grep -qE '"result": "(failure|cancelled)"'

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
