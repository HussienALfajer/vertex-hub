name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vertex_hub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vertex_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertex_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vertex_hub:ci-only-password@localhost:5432/vertex_hub_test
      TEST_DATABASE_URL: postgres://vertex_hub:ci-only-password@localhost:5432/vertex_hub_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      - name: The web app's OpenAPI document and client types match the API
        run: |
          pnpm --filter @vertex-hub/api openapi:export
          pnpm --filter @vertex-hub/web api:generate
          git diff --exit-code -- apps/web/src/lib/api

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vertex-hub/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
